{% extends "base.html" %}
{% block title %}댓글 수정{% endblock %}
{% block stylesheet %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/board.css') }}" />
{% endblock %}
{% block content %}
<main class="board-page">
  <form class="edit-form" method="post">
    <h1>댓글 수정</h1>
    <textarea
      name="content"
      maxlength="2000"
      placeholder="#여행 #동창회처럼 태그할 수 있어요."
      required
    >{{ comment.content }}</textarea>
    <button type="submit">저장</button>
    <a href="{{ url_for('board_view', post_id=comment.post_id) }}#comment-{{ comment.id }}">취소</a>
  </form>
</main>
{% endblock %}
