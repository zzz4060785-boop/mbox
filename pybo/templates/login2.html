{% extends "base.html" %}

{% block title %}{{ tr('간편 로그인') }}{% endblock %}

{% block stylesheet %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/login2.css') }}"
/>
{% endblock %}

{% block content %}
<section class="login-page">
  <div class="login-box">
    <h1>{{ tr('로그인') }}</h1>

    <form method="post">
      <input
        type="text"
        name="login_id"
        value="{{ saved_login_id }}"
        class="input-field"
        placeholder="{{ tr('아이디 또는 이메일') }}"
        autocomplete="username"
        required
      />

      <input
        type="password"
        name="password"
        class="input-field"
        placeholder="{{ tr('비밀번호') }}"
        autocomplete="current-password"
        required
      />

      <div class="save-info">
        <input
          type="checkbox"
          id="saveInfo"
          name="save_info"
          checked
        />
        <label for="saveInfo">{{ tr('간편 로그인 정보 저장') }}</label>
      </div>

      <button type="submit" class="login-btn">{{ tr('로그인') }}</button>
    </form>

    <p class="divider">{{ tr('또는') }}</p>

    <button type="button" class="sub-btn qr-btn">{{ tr('QR코드 로그인') }}</button>

    <div class="find-links">
      <a href="{{ url_for('find_id') }}">{{ tr('아이디 찾기') }}</a>
      <span>|</span>
      <a href="{{ url_for('forgot_password') }}">{{ tr('비밀번호 찾기') }}</a>
    </div>

    <button type="button" class="sub-btn signup-btn" id="openSignupBtn">
      {{ tr('새 계정 만들기') }}
    </button>

    <button
      type="button"
      class="sub-btn google-btn social-login-btn"
      data-url="{{ url_for('google_login') }}"
    >
      {{ tr('Google로 시작하기') }}
    </button>

    <button
      type="button"
      class="sub-btn kakao-btn social-login-btn"
      data-url="{{ url_for('kakao_login') }}"
    >
      {{ tr('카카오로 시작하기') }}
    </button>

    <button
      type="button"
      class="sub-btn naver-btn social-login-btn"
      data-url="{{ url_for('naver_login') }}"
    >
      {{ tr('네이버로 시작하기') }}
    </button>
  </div>

  <div id="signupModal" class="signup-modal" aria-hidden="true">
    <div class="signup-box">
      <h2 id="signupTitle">{{ tr('회원가입') }}</h2>

      <form method="post" action="{{ url_for('signup') }}">
        <input
          type="text"
          name="username"
          class="input-field"
          placeholder="{{ tr('이름') }}"
          autocomplete="username"
          required
        />

        <input
          type="email"
          name="email"
          class="input-field"
          placeholder="{{ tr('이메일') }}"
          autocomplete="email"
          required
        />

        <input
          type="password"
          name="password"
          class="input-field"
          placeholder="{{ tr('비밀번호') }}"
          autocomplete="new-password"
          minlength="8"
          required
        />

        <button type="submit" class="login-btn">{{ tr('가입하기') }}</button>

        <button type="button" class="sub-btn close-btn" id="closeSignupBtn">
          {{ tr('닫기') }}
        </button>
      </form>
    </div>
  </div>
</section>
{% endblock %}

{% block script %}
<script src="{{ url_for('static', filename='js/login2.js') }}"></script>
{% endblock %}
