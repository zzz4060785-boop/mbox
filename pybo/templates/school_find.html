{% extends "base.html" %} {% block title %}학교 찾기{% endblock %} {% block
stylesheet %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/school_find.css') }}"
/>
{% endblock %} {% block content %}
<main class="school-find-page">
  <h1>friendary memories</h1>
  <hr />

  <section class="school-search-box">
    <h2>학교 공간 입장</h2>

    <div class="school-section">
      <label class="sr-only" for="currentSchoolType">학교 구분</label>
      <select class="year-input" id="currentSchoolType">
        <option value="">학교 구분 선택</option>
        <option>초등학교</option>
        <option>중학교</option>
        <option>고등학교</option>
        <option>대학교</option>
      </select>

      <label class="sr-only" for="schoolInput">현재 학교명</label>
      <input
        type="text"
        class="school-input"
        id="schoolInput"
        placeholder="현재 학교명 검색"
        autocomplete="off"
      />
      <ul class="school-list" id="schoolList"></ul>

      <label class="sr-only" for="currentEnterYear">입학연도</label>
      <select class="year-input" id="currentEnterYear">
        <option value="">입학연도 선택</option>
      </select>

      <label class="sr-only" for="currentMajor">학과 또는 전공</label>
      <input
        type="text"
        class="school-input"
        id="currentMajor"
        placeholder="학과 또는 전공 입력"
      />

      <button class="search-btn" id="enterCurrentSchoolBtn" type="button">
        재학생 공간 입장
      </button>
    </div>

    <div class="school-section">
      <label class="sr-only" for="graduateSchoolType">학교 구분</label>
      <select class="year-input" id="graduateSchoolType">
        <option value="">학교 구분 선택</option>
        <option>초등학교</option>
        <option>중학교</option>
        <option>고등학교</option>
        <option>대학교</option>
      </select>

      <label class="sr-only" for="graduateSchoolInput">졸업 학교명</label>
      <input
        type="text"
        class="school-input"
        id="graduateSchoolInput"
        placeholder="졸업 학교명 검색"
        autocomplete="off"
      />
      <ul class="school-list" id="graduateSchoolList"></ul>

      <label class="sr-only" for="graduateYear">졸업년도</label>
      <select class="year-input" id="graduateYear">
        <option value="">졸업년도 선택</option>
      </select>

      <button class="search-btn" id="enterGraduateSchoolBtn" type="button">
        동창 공간 입장
      </button>
    </div>

    <p class="form-message" id="schoolMessage" aria-live="polite"></p>

    <!--
      [학교 직접 입력 모달 버튼]
      아래 문구를 바꾸면 화면에 표시되는 버튼 문구가 변경됩니다.
      모달 기능을 삭제하려면 이 버튼과 아래의 [모달 시작]~[모달 끝]을
      함께 삭제하고, school_find.css와 school_find.js의 같은 이름 주석
      구간도 삭제하세요.
    -->
    <button class="manual-school-btn" id="openSchoolModalBtn" type="button">
      찾는 학교가 없나요? 직접 입력하기
    </button>
  </section>

  <!-- ================= 학교 직접 입력 모달 시작 ================= -->
  <!--
    [문구 수정 방법]
    제목: "학교 직접 입력"
    안내문: "학교 정보를 입력하면..."
    입력 안내: 각 input의 placeholder
    저장 버튼: "저장하고 앨범 입장"
    위 문구들을 이 구간에서 원하는 내용으로 수정하면 됩니다.

    [모달 삭제 방법]
    이 [모달 시작]부터 아래 [모달 끝]까지 전부 삭제하세요.
  -->
  <div
    class="school-modal"
    id="schoolModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="schoolModalTitle"
    hidden
  >
    <div class="school-modal__backdrop" data-close-school-modal></div>
    <div class="school-modal__content">
      <button
        class="school-modal__close"
        type="button"
        aria-label="닫기"
        data-close-school-modal
      >
        &times;
      </button>
      <h2 id="schoolModalTitle">학교 직접 입력</h2>
      <p class="school-modal__description">
        학교 정보를 입력하면 다음 로그인부터 이 학교 앨범으로 바로 이동합니다.
      </p>

      <label for="modalSchoolName">학교명</label>
      <input
        class="school-input"
        id="modalSchoolName"
        type="text"
        placeholder="학교명을 입력해 주세요"
        autocomplete="off"
      />
      <ul class="school-list school-list--modal" id="modalSchoolList"></ul>

      <label for="modalSchoolType">학교 구분</label>
      <select class="year-input" id="modalSchoolType">
        <option value="">학교 구분 선택</option>
        <option>초등학교</option>
        <option>중학교</option>
        <option>고등학교</option>
        <option>대학교</option>
      </select>

      <label for="modalSchoolYear">연도</label>
      <select class="year-input" id="modalSchoolYear">
        <option value="">연도 선택</option>
      </select>

      <label for="modalSchoolMajor">학과 또는 전공</label>
      <input
        class="school-input"
        id="modalSchoolMajor"
        type="text"
        placeholder="선택 입력"
      />

      <p class="form-message" id="schoolModalMessage" aria-live="polite"></p>
      <button class="search-btn" id="saveModalSchoolBtn" type="button">
        저장하고 앨범 입장
      </button>
    </div>
  </div>
  <!-- ================== 학교 직접 입력 모달 끝 ================== -->
</main>
{% endblock %} {% block script %}
<script
  src="{{ url_for('static', filename='js/school_find.js') }}"
  data-album-url="{{ url_for('main_album') }}"
  data-save-school-url="{{ url_for('save_school_selection') }}"
  data-school-search-url="{{ url_for('search_schools') }}"
></script>
{% endblock %}
